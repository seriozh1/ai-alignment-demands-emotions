# Experiment 2026-10-25: experiment 2026-10-18_full_shuffled with Qwen2.5-VL-7B-Instruct, a video model evaluated in the MoMentS
# paper. Everything except the model is as in 2026-10-18.
# Run by notebooks/11_2026-10-25_qwen25vl_full.ipynb; results go to outputs/<experiment>/.
experiment = "2026-10-25_qwen25vl_full"

model_id = "Qwen/Qwen2.5-VL-7B-Instruct"
model_revision = "cc594898137f460bfe9f0759e9844b3ce807cfb5"

n_frames = 64
max_pixels = 602112  # native resolution, as for Qwen2.5-Omni (the same frames and video tokens)

conditions = ["Q_noE", "Q", "T", "T_told", "VT", "VTmis"]
option_e = "Cannot tell from the given information."
told_note = "A video of this scene exists, but it is not shown to you."
shuffle_seed = 0

explain_prompt = "Explain in one sentence which information you based your answer on."
explain_max_new_tokens = 200
evidence_question = "Besides the question and its options, what did you base your answer on?"

[evidence_options]
nothing = "Nothing else"
transcript = "A transcript"
video = "A video"
both = "Both a transcript and a video"
