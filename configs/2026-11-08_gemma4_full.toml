# Experiment 2026-11-08: the full run (598 questions, six conditions, shuffled options, two follow-up questions) with
# Gemma 4 12B (google/gemma-4-12B-it, thinking off), a recent open model from a non-Qwen family. Prompts, frames,
# option orders and follow-up questions are the same as for the other models.
# Run by notebooks/16_2026-11-08_gemma4_full.ipynb; results go to outputs/<experiment>/.
experiment = "2026-11-08_gemma4_full"

model_id = "google/gemma-4-12B-it"
model_revision = "43c9d014b231474fa7212dbb48a762566c2b255d"

n_frames = 64
max_pixels = 602112  # the same frames as for the other models; the processor uses up to 70 tokens per frame

conditions = ["Q_noE", "Q", "T", "T_told", "VT", "VTmis"]
option_e = "Cannot tell from the given information."
told_note = "A video of this scene exists, but it is not shown to you."
shuffle_seed = 0

explain_prompt = "Explain in one sentence which information you based your answer on."
explain_max_new_tokens = 200
evidence_question = "Besides the question and its options, what did you base your answer on?"

[evidence_options]
nothing = "Nothing else"
transcript = "A transcript"
video = "A video"
both = "Both a transcript and a video"
